steps:
  # 1. Build and push the API container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-api'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${COMMIT_SHA}'
      - '-f'
      - 'apps/api/Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-api'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${COMMIT_SHA}'

  # 2. Deploy the API to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-api'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/api:${COMMIT_SHA}'
      - '--region'
      - '${_REGION}'
      - '--service-account'
      - '${_RUNTIME_SA}'
      - '--add-cloudsql-instances'
      - '${_CLOUDSQL_CONNECTION_NAME}'
      - '--update-env-vars'
      - 'NODE_ENV=production,WEB_ORIGIN=${_WEB_ORIGIN}'
      - '--set-secrets'
      - 'DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest'

  # 3. Build the Web App for Firebase Hosting
  - name: 'node:22'
    id: 'build-web'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        corepack enable
        pnpm install --frozen-lockfile
        pnpm --filter @steadycut/shared build
        pnpm --filter @steadycut/web build
    env:
      - 'VITE_API_URL=${_VITE_API_URL}'

  # 4. Deploy to Firebase Hosting
  # Note: Requires the Firebase token or Cloud Build SA with Firebase Admin permissions
  - name: 'gcr.io/${PROJECT_ID}/firebase'
    id: 'deploy-web'
    args: ['deploy', '--only', 'hosting']

substitutions:
  _REGION: 'us-central1'
  _REPOSITORY: 'app'
  _SERVICE_NAME: 'steadycut-api'
  _RUNTIME_SA: 'api-runtime@${PROJECT_ID}.iam.gserviceaccount.com'
  _CLOUDSQL_CONNECTION_NAME: 'PROJECT_ID:REGION:INSTANCE_NAME'
  _WEB_ORIGIN: 'https://steadycut-coach.web.app'
  _VITE_API_URL: 'https://steadycut-api-xyz.a.run.app/api'

options:
  logging: CLOUD_LOGGING
